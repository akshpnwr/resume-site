<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A sticky note in the site's wireframe language: sticky-yellow ground,
       dark ink border, and the hand-drawn "A" that stands in for the name.

       Deliberately heavier than the page's 2px dashed/dotted strokes — at a
       16px tab those weights disappear, so the wireframe vocabulary is kept
       (yellow note, ink outline, turned-up corner) while the weights are
       scaled to survive the smallest rendering. The corner fold is cut as a
       solid notch rather than an outlined flap, and the "A" is inset well
       clear of it, because at 16px adjacent strokes merge into a smear.

       Colours are hard-coded light-theme values: a favicon cannot read CSS
       custom properties, and the yellow/ink pairing stays legible on both
       light and dark browser chrome. -->

  <!-- sticky-yellow note body, corner clipped off at the bottom right -->
  <path d="M6 5h52v40L45 59H6z"
        fill="#fff740" stroke="#21252d" stroke-width="5"
        stroke-linejoin="round" />

  <!-- the turned-up corner, filled in ink so it survives as a solid wedge -->
  <path d="M45 59V45h13z" fill="#21252d" />

  <!-- hand-drawn "A", inset from the fold so the strokes stay separate -->
  <path d="M21 40 L30 17 L39 40 M24.5 33 H35.5"
        fill="none" stroke="#21252d" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
